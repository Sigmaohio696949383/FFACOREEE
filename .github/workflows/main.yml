name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          mkdir out
          unzip -o *.zip -d out
          find out -name pom.xml
      - run: |
          F="$(find out -name FFACore.java | head -1)"
          sed -i 's/sb\.color(ChatColor\.WHITE)/sb.color(NamedTextColor.WHITE)/' "$F"
          sed -i '/^import org\.bukkit\.ChatColor;/d' "$F"
          P="$(find out -name plugin.yml | head -1)"
          sed -i 's/^description: .*/description: Advanced FFA Core/' "$P"
      - run: |
          cd "$(dirname "$(find out -name pom.xml | head -1)")"
          mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: FFACore
          path: out/**/target/FFACore-*.jar
